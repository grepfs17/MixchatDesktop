[package]
name = "mixchat-desktop"
version = "0.6.3"
description = "Tauri desktop shell that runs the Mixchat Astro server locally."
authors = ["Mixchat"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mixchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = "0.4"
# Text only (no image-data). The shell reads the OS clipboard for the Paste
# menu item because webviews refuse script-initiated clipboard reads.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["time", "signal", "macros", "fs", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", features = ["block2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "mixchat-desktop"
version = "0.4.3"
description = "Tauri desktop shell that runs the Mixchat Astro server locally."
authors = ["Mixchat"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mixchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = "0.4"
tokio = { version = "1", features = ["time", "signal", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
